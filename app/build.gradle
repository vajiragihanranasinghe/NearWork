plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.nearwork'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.nearwork"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
